# =====================================================================
# --- Other effects
# =====================================================================

[led_effect pause_heartbeat]
  leds: 
    neopixel:chamber_lights
    neopixel:stealthburner (1,2,3)
    neopixel:electrical_bay
autostart:                             false
frame_rate:                            40    
layers:
    strobe 1 1.5 add (1.0, 1.0, 1.0, 1.0)
    breathing 2 0 difference (1.0, 0.25, 0.0)
    static 1 0 top (1.0, 0.25, 0.0)


