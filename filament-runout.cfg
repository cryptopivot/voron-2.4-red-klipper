#####################################################################
# Voron Red — Filament runout sensor + behavior (NEW FILE)
# Creality-style mechanical switch: TWO OUTER PINS only (COM + NO/NC)
#
# Include AFTER mainsail.cfg and LED macros/effects:
#   [include filament-runout/filament-runout-leds.cfg]
#   [include filament-runout/filament-runout.cfg]
#
# Pin: Octopus Stop3 = PG11 (signal) + GND. Leave the header 5V unused.
# Creality mechanical switch = two outer pins only.
#####################################################################

[gcode_macro _RUNOUT_STATE]
description: Saved temps / flags for filament runout handling
variable_saved_extruder_temp: 0.0
variable_saved_bed_temp: 0.0
variable_active: 0
variable_prev_idle_timeout: 0.0
gcode:
    # state-only macro

[gcode_macro STATUS_RUNOUT]
description: Red/orange runout LED alert
gcode:
    _LED_LOCK
    SET_LED_EFFECT EFFECT=runout_alert REPLACE=1


#####################################################################
# Sensor
# switch_pin: use ^ for internal pullup (typical for a dry mechanical switch
# to GND). If your wiring is the opposite polarity, flip with !  e.g. ^!PG11
# and/or set sense in Mainsail after QUERY.
#####################################################################


[gcode_macro CHECK_FILAMENT]
description: Abort if runout sensor enabled and filament not detected
gcode:
    {% set sens = printer["filament_switch_sensor runout"] %}
    {% if sens.enabled and (not sens.filament_detected) %}
        M117 No filament — load before print
        RESPOND TYPE=error MSG="No filament detected. Load filament, then start again."
        { action_raise_error("No filament detected — load filament before starting") }
    {% endif %}

[filament_switch_sensor runout]
switch_pin: ^!PG11
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
runout_gcode:
    # PAUSE already ran (park + status_pause). Now specialize for runout.
    {% set ext_t = printer.extruder.target|float %}
    {% set bed_t = printer.heater_bed.target|float %}
    {% set idle_t = printer.configfile.settings.idle_timeout.timeout|default(600)|float %}
    SET_GCODE_VARIABLE MACRO=_RUNOUT_STATE VARIABLE=saved_extruder_temp VALUE={ext_t}
    SET_GCODE_VARIABLE MACRO=_RUNOUT_STATE VARIABLE=saved_bed_temp VALUE={bed_t}
    SET_GCODE_VARIABLE MACRO=_RUNOUT_STATE VARIABLE=prev_idle_timeout VALUE={idle_t}
    SET_GCODE_VARIABLE MACRO=_RUNOUT_STATE VARIABLE=active VALUE=1

    M117 RUNOUT: parked — bed ON, nozzle OFF
    RESPOND TYPE=echo MSG="Filament runout: parked. Bed held, nozzle off. Load filament, wait for heat, then RESUME."

    # Nozzle off — keep bed at its print target (or leave as-is if already 0)
    M104 S0
    {% if bed_t > 0 %}
    M140 S{bed_t}
    {% endif %}

    # Don't let idle_timeout kill the bed while you hunt for filament
    SET_IDLE_TIMEOUT TIMEOUT=43200

    # Re-assert LEDs after park/heater cmds so they do not stay dark
    STATUS_RUNOUT

insert_gcode:
    {% set st = printer["gcode_macro _RUNOUT_STATE"] %}
    {% if st.active|int == 1 %}
        # Keep runout_alert flashing until RESUME (do not switch LEDs here)
        M117 Filament detected — heating nozzle, then press RESUME
        RESPOND TYPE=echo MSG="Filament detected. Nozzle reheating to saved temp. LEDs stay on runout alert until RESUME."
        {% if st.saved_extruder_temp|float > 0 %}
        M104 S{st.saved_extruder_temp|float}
        {% endif %}
        {% if st.saved_bed_temp|float > 0 %}
        M140 S{st.saved_bed_temp|float}
        {% endif %}
        STATUS_RUNOUT
    {% else %}
        RESPOND TYPE=echo MSG="Filament sensor: filament present."
    {% endif %}

#####################################################################
# Optional: call these from LOAD/UNLOAD so swapping filament doesn't
# false-trigger runout. Snippets are in the README.
#####################################################################

[gcode_macro RUNOUT_SENSOR_OFF]
description: Disable filament runout sensor
gcode:
    SET_FILAMENT_SENSOR SENSOR=runout ENABLE=0
    RESPOND TYPE=echo MSG="Runout sensor DISABLED"

[gcode_macro RUNOUT_SENSOR_ON]
description: Enable filament runout sensor
gcode:
    SET_FILAMENT_SENSOR SENSOR=runout ENABLE=1
    RESPOND TYPE=echo MSG="Runout sensor ENABLED"


[gcode_macro RUNOUT_PURGE_BUCKET]
description: Purge into single purge bucket at CURRENT Z (never lower Z / snap string)
# Mike's bucket: Y299, X95–135 (center X115)
variable_bucket_x: 115.0
variable_bucket_y: 299.0
variable_purge_len: 55
variable_purge_spd: 200
variable_purge_ret: 1
variable_ooze_dwell: 5
variable_purge_temp_min: 220
variable_z_lift: 2.0
variable_snap_dx: -10.0
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        { action_raise_error("RUNOUT_PURGE_BUCKET: home axes first") }
    {% endif %}
    {% set m = printer["gcode_macro RUNOUT_PURGE_BUCKET"] %}
    {% set bx = m.bucket_x|float %}
    {% set by = m.bucket_y|float %}
    {% set purge_len = m.purge_len|float %}
    {% set purge_spd = m.purge_spd|float %}
    {% set purge_ret = m.purge_ret|float %}
    {% set ooze_dwell = m.ooze_dwell|float %}
    {% set purge_temp_min = m.purge_temp_min|float %}
    {% set z_lift = m.z_lift|float %}
    {% set snap_dx = m.snap_dx|float %}
    {% set z0 = printer.toolhead.position.z|float %}
    {% set z_travel = z0 + z_lift %}

    G90
    G1 Z{z_travel} F1500
    G1 X{bx} Y{by} F9000

    {% if printer.extruder.temperature >= purge_temp_min %}
        M83
        ; Longer slower purge so blob drops into bucket
        G1 E{purge_len} F{purge_spd}
        G4 P{ooze_dwell * 1000}
        ; Flick toward bed center to leave the string in the bucket
        G1 X{bx + snap_dx} F4000
        G1 E-{purge_ret} F{purge_spd * 5}
        G92 E0
        M117 Runout purge+snap done (bucket)
    {% else %}
        RESPOND TYPE=echo MSG="RUNOUT_PURGE_BUCKET: skipped purge (below purge_temp_min)"
    {% endif %}


#####################################################################
# Wrap RESUME so a runout recovery reheats fully and restores idle timer
#####################################################################

[gcode_macro RESUME]
rename_existing: RUNOUT_BASE_RESUME
description: Resume print (runout-aware: filament + heat + bucket purge)
gcode:
    {% set st = printer["gcode_macro _RUNOUT_STATE"] %}
    {% if st.active|int == 1 %}
        {% set need = st.saved_extruder_temp|float %}
        {% set bed_need = st.saved_bed_temp|float %}
        {% set detected = printer["filament_switch_sensor runout"].filament_detected %}

        {% if not detected %}
            M117 RESUME blocked — load filament
            RESPOND TYPE=error MSG="RESUME blocked: filament not detected. Load filament, then try RESUME again."
            { action_raise_error("RESUME blocked: filament not detected") }
        {% endif %}

        {% if need > 0 %}
            M117 Runout resume: heating nozzle to {need|int}C
            M104 S{need}
            {% if bed_need > 0 %}
            M140 S{bed_need}
            {% endif %}
            TEMPERATURE_WAIT SENSOR=extruder MINIMUM={need}
        {% endif %}

        {% if need > 0 and printer.extruder.temperature|float < (need - 2.0) %}
            M117 RESUME blocked — nozzle too cold
            RESPOND TYPE=error MSG="RESUME blocked: nozzle not at target temperature yet."
            { action_raise_error("RESUME blocked: nozzle not at temperature") }
        {% endif %}

        # Purge over bucket at current Z only — never drop to brush (floating gantry)
        M117 Runout resume: bucket purge (Z safe)
        RUNOUT_PURGE_BUCKET

        {% if st.prev_idle_timeout|float > 0 %}
            SET_IDLE_TIMEOUT TIMEOUT={st.prev_idle_timeout|float}
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_RUNOUT_STATE VARIABLE=active VALUE=0
        _LED_UNLOCK
        STATUS_PRINTING
    {% endif %}
    RUNOUT_BASE_RESUME
