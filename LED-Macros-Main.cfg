#####################################################################
# Global Intercept Interlock
#####################################################################
[gcode_macro SET_LED]
rename_existing: SET_LED_BASE
gcode:
    {% set led = params.LED|default("")|string %}
    {% set red = params.RED|default(0.0)|float %}
    {% set green = params.GREEN|default(0.0)|float %}
    {% set blue = params.BLUE|default(0.0)|float %}
    {% set white = params.WHITE|default(0.0)|float %}
    {% set index = params.INDEX|default("")|string %}
    {% if led %}
        {% if "neopixel:" in led or "dotstar:" in led %}
            STOP_LED_EFFECTS LEDS="{led}"
        {% else %}
            STOP_LED_EFFECTS LEDS="neopixel:{led}"
        {% endif %}
    {% endif %}
    {% if index %}
        SET_LED_BASE LED={led} RED={red} GREEN={green} BLUE={blue} WHITE={white} INDEX={index}
    {% else %}
        SET_LED_BASE LED={led} RED={red} GREEN={green} BLUE={blue} WHITE={white}
    {% endif %}