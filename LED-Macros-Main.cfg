[include LED-Effects-Main.cfg]

#####################################################################
# LED Sequence State
#####################################################################
[gcode_macro _LED_SEQUENCE]
variable_active: 0
variable_in_print: 0
gcode:

[gcode_macro _LED_LOCK]
gcode:
    SET_GCODE_VARIABLE MACRO=_LED_SEQUENCE VARIABLE=active VALUE=1

[gcode_macro _LED_UNLOCK]
gcode:
    SET_GCODE_VARIABLE MACRO=_LED_SEQUENCE VARIABLE=active VALUE=0

#####################################################################
# Status Macros
#####################################################################
[gcode_macro status_ready]
gcode:
    {% if printer["gcode_macro _LED_SEQUENCE"].active|int == 0 %}
        STOP_LED_EFFECTS LEDS="neopixel:stealthburner"
        STOP_LED_EFFECTS LEDS="neopixel:chamber_lights"
        STOP_LED_EFFECTS LEDS="neopixel:electrical_bay"
        SET_LED_EFFECT EFFECT=sb_logo_idle
        SET_LED_EFFECT EFFECT=sb_nozzle_idle
        SET_LED_EFFECT EFFECT=Chamber_idle_led
        SET_LED_EFFECT EFFECT=Bay_idle_led
    {% endif %}

[gcode_macro status_heating]
gcode:
    _LED_LOCK
    SET_LED_EFFECT EFFECT=sb_logo_thermal REPLACE=1
    SET_LED_EFFECT EFFECT=sb_nozzle_thermal REPLACE=1
    SET_LED_EFFECT EFFECT=chamber_thermal REPLACE=1
    SET_LED_EFFECT EFFECT=bay_thermal REPLACE=1

