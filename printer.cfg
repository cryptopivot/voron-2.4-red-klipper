[include ./KlickyProbe/klicky-probe.cfg]
[include nitehawk-sbv2.cfg]
[include mainsail.cfg]
#[include adxl345-v2.0.cfg]
[include Knomi2.cfg]
[include nozzle_scrub-2.cfg]
[include timelapse.cfg]
[include LED-Macros-Main.cfg]
[include filament-runout.cfg]

#####################################################################
# Mainsail client vars (keep out of mainsail.cfg — Moonraker reserved)
#####################################################################
[gcode_macro _CLIENT_VARIABLE]
variable_runout_sensor : "filament_switch_sensor runout"
gcode:



[mcu]
serial: /dev/serial/by-id/usb-Klipper_YOUR_MCU_SERIAL

[mcu nhk]
serial: /dev/serial/by-id/usb-Klipper_YOUR_MCU_SERIAL

##--------------------------------------------------------------------
[exclude_object]


##################################################################
#   X/Y Printer Settings
##################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 5000
max_z_velocity: 25
max_z_accel: 400
square_corner_velocity: 5.0


##################################################################
#   X/Y Stepper Settings
##################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
##  Endstop connected to DIAG_0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  
endstop_pin: ^PG6 
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 100   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0

##  A Stepper - Right
##  Connected to MOTOR_1
##  Endstop connected to DIAG_1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
endstop_pin: ^PG9 
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 80  #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0
 
#####################################################################
#   Z Stepper Settings
#####################################################################

## Z0 Stepper - Front Left
##  Connected to MOTOR_2
##  Endstop connected to DIAG_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 260
position_min: -5
homing_speed: 7
second_homing_speed: 3
homing_retract_dist: 2

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0


##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PA3
sensor_pin: PF3
sensor_type: Generic 3950
max_power: 0.90
min_temp: 0
max_temp: 120


######################################################################
# Fan Control
#####################################################################
[temperature_fan MCU_Bay_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
sensor_type: temperature_mcu
control: watermark
max_delta: 3.0
kick_start_time: 0.3
min_temp: 0
max_temp: 100
target_temp: 46
max_speed: 1.0
min_speed: 0.0
off_below: 0.22


[temperature_fan Pi5_Bay_fan]
pin: PD12
max_power: 1.0
shutdown_speed: 0.0
sensor_type: temperature_host
control: watermark
max_delta: 4.0
kick_start_time: 0.3
min_temp: 0
max_temp: 100
target_temp: 46
max_speed: 1.0
min_speed: 0.0
off_below: 0.22

##  Exhaust fan - FAN4
[fan_generic exhaust_fan]
pin: PD14
max_power: 1.0
kick_start_time: 0.3


[delayed_gcode DISABLE_EXHAUST]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.0





#####################################################################
# Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
timeout: 1800


[quad_gantry_level]
gantry_corners:
   -60,-10
   360,370
points:
  50,25
  50,225
  250,225
  250,25
#--------------------------------------------------------------------
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.008
max_adjust: 6


########################################
# Bed Mesh
########################################

[bed_mesh]
speed: 200
horizontal_move_z: 10
mesh_min: 30, 30         
mesh_max: 270, 270        
probe_count: 9, 9       
algorithm: bicubic        
fade_start: 0.6           # Starts slowly tapering the mesh compensation at 0.6mm
fade_end: 10.0             # Fully transitions to a perfectly flat plane by 10.0mm
fade_target: 0            # Fades cleanly toward your Z-offset zero point

#####################################################################
#   Macros
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: Unloading Filament
gcode:
  RUNOUT_SENSOR_OFF
  {% set TEMP = params.TEMP|default(230)|int %}

  {% if printer.toolhead.homed_axes != "xyz" %}
    M117 Homing...
    G28
  {% endif %}
  STATUS_UNLOADING

  M117 Parking front...
  G90
  {% set z = printer.toolhead.position.z|float %}
  {% if z < 30.0 %}
    G1 Z30 F1200
  {% endif %}
  G1 X150 Y30 F9000
  M400

  M117 Heating...
  M104 S{TEMP}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TEMP}

  M117 Unloading...
  G91
  G92 E0
  G1 E6 F300
  G1 E-4 F3000
  G4 P2000
  G1 E-75 F1200
  M400

  PARK  #ADDED TO SEND TOOL HEAD BACK TO REAR RIGHT

  M104 S0
  M117 Unload complete
  _LED_UNLOCK
  RUNOUT_SENSOR_ON
  STATUS_READY
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: filament loading
gcode:
  RUNOUT_SENSOR_OFF
  {% set TEMP = params.TEMP|default(240)|int %}

  {% if printer.toolhead.homed_axes != "xyz" %}
    M117 Homing...
    G28
  {% endif %}
  STATUS_LOADING

  M117 Parking front...
  G90
  {% set z = printer.toolhead.position.z|float %}
  {% if z < 30.0 %}
    G1 Z30 F1200
  {% endif %}
  G1 X150 Y30 F9000
  M400

  M117 Heating...
  M104 S{TEMP}
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TEMP}

  M117 Loading...
  G91
  G92 E0
  G1 E75 F1200
  G1 E50 F120
  G1 E-4 F1800
  M400

  PARK  #ADDED TO SEND TOOL HEAD BACK TO REAR RIGHT

  M117 Load complete
  _LED_UNLOCK
  RUNOUT_SENSOR_ON
  STATUS_READY
#####################################################################


#####################################################################


[gcode_macro START_EXHAUST_TIMER]
gcode:
    {% set duration = params.DURATION|default(30)|int %}
    # Make sure the fan is on
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0
    # Cancel any previous timer, then start a new one
    UPDATE_DELAYED_GCODE ID=DISABLE_EXHAUST DURATION=0
    UPDATE_DELAYED_GCODE ID=DISABLE_EXHAUST DURATION={duration}

#####################################################################

[gcode_macro PARK]
gcode:
    G90
    G1 X297 Y297 F6000
    
#####################################################################

[gcode_macro G32]
gcode:
    _LED_LOCK
    SET_GCODE_VARIABLE MACRO=_LED_SEQUENCE VARIABLE=in_print VALUE=1
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    BED_MESH_CLEAR
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    G28 X Y
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False
    ATTACH_PROBE_LOCK
    G28 Z
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=True
    QUAD_GANTRY_LEVEL
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=probing VALUE=False
    G28 Z
    DOCK_PROBE_UNLOCK
    SET_GCODE_VARIABLE MACRO=_LED_SEQUENCE VARIABLE=in_print VALUE=0
    _LED_UNLOCK
    STATUS_READY
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32

#####################################################################
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause print
gcode:
    {% set x_park = printer.toolhead.axis_minimum.x + 10.0 %}
    {% set y_park = printer.toolhead.axis_maximum.y - 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 5.0) %}
        {% set z_safe = 5.0 %}
    {% else %}
        {% set z_safe = max_z - act_z + 1.0 %}
    {% endif %}
    status_pause
    # BASE_PAUSE (Mainsail) already retracts ~1mm + parks.
    # Do NOT add another E retract here — it was not unretracted on RESUME (air printing).
    BASE_PAUSE
    G91
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
    M400


#####################################################################


# RESUME handled in filament-runout.cfg (runout-aware). Do not redefine here.


#####################################################################

[gcode_macro CANCEL_PRINT]
description: Cancel print
rename_existing: CANCEL_PRINT_BASE
gcode:
  G91
  G0 Z10 F900
  G90
  #G0 X10 Y10 F6000
  PARK
  TURN_OFF_HEATERS
  M106 S0
  {% if printer["fan_generic exhaust_fan"].speed > 0.0 %}
    M117 Clearing fumes (5m)...
    START_EXHAUST_TIMER DURATION=300
  {% endif %}
  CLEAR_PAUSE
  SET_GCODE_VARIABLE MACRO=_LED_SEQUENCE VARIABLE=in_print VALUE=0
  _LED_UNLOCK
  STATUS_READY
  CANCEL_PRINT_BASE

#####################################################################  
#####################################################################
#   Print Start / End Orchestration
#####################################################################

[gcode_macro PRINT_START]
gcode:
  STATUS_HEATING 
  # Fetch data from your slicer
  {% set BED_TEMP = params.BED|default(60)|float %}
  {% set target_extruder = params.EXTRUDER|default(200)|int %}
  {% set target_chamber = params.CHAMBER|default("45")|int %}
  {% set target_chamber_minimal = params.CHAMBER_MINIMAL|default("0")|int %}
  {% set target_chamber_wait = [target_chamber, target_chamber_minimal]|select(">", 0)|min|default(0) %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

  # Clear any lingering pause states
  _LED_LOCK
  SET_GCODE_VARIABLE MACRO=_LED_SEQUENCE VARIABLE=in_print VALUE=1
  CLEAR_PAUSE

  # Abort early if filament sensor says empty
  CHECK_FILAMENT

  # Reset the G-Code Z offset (adjust Z offset if needed)
  SET_GCODE_OFFSET Z=0.0

  # Start heating the bed and hotend to a safe standby temp (150c) to prevent oozing during probing
  SET_DISPLAY_TEXT MSG="Bed heating"
  STATUS_HEATING                                        # Wakes up live 30c-70c bed tracker + hotend thermal loops!
  M104 S150                                             # Set standby hotend temp
  M190 S{BED_TEMP}                                      # Wait for bed to reach target temp

  # Smart Leveling Logic
  {% if "xyz" not in printer.toolhead.homed_axes or printer.quad_gantry_level.applied|lower == 'false' %}
    SET_DISPLAY_TEXT MSG="Leveling & Homing"
    #STATUS_HOMING                                       # Switches toolhead to homing animations cleanly
    BED_MESH_CLEAR

    {% if "xy" not in printer.toolhead.homed_axes %}
      SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
      G28 X Y
      SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False
    {% endif %}

    ATTACH_PROBE_LOCK
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    G28 Z
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False
    #STATUS_LEVELING                                     # Switches toolhead to leveling loop

    {% if printer.quad_gantry_level.applied|lower == 'false' %}
      SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=True
      QUAD_GANTRY_LEVEL
      SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=qgling VALUE=False
      G28 Z
    {% endif %}

    DOCK_PROBE_UNLOCK
  {% else %}
    SET_DISPLAY_TEXT MSG="Skipping QGL: Already level"
    # Still home Z so first layer height is correct
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=True
    G28 Z
    SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=homing VALUE=False
  {% endif %}

  #  Smart Bed Mesh Profile Selection Logic
  {% if BED_TEMP > 80 %}
    BED_MESH_PROFILE LOAD=90Temp-9x9-HB
    SET_DISPLAY_TEXT MSG="Loaded 90Temp-9x9-HB mesh"
  {% else %}
    BED_MESH_PROFILE LOAD=60Temp-9x9-HB
    SET_DISPLAY_TEXT MSG="Loaded 60Temp-9x9-HB mesh"
  {% endif %}
             
  # Heat up the hotend up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  STATUS_HEATING                                        # Re-arms thermal dashboard during hotend ramp
  G1 X{x_wait - 50} Y4 Z15 F9000                        # Go to primeline
  M107                                                  # Turn off partcooling fan
  M109 S{target_extruder}                               # Heat the hotend to set temp
  M83 
  G1 E-2.0 F2100
  CLEAN_NOZZLE                                          # Clean Nozzle
  M400                                                  ; FORCE Klipper to finish the entire wipe before reading next line!

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Bad Ass Machine Printing Now"               # Display info on display
  STATUS_PRINTING                                       # Wakes up breathing Green logo + floods canopy with full White!
  #G0 X{x_wait - 50} Y4 F10000                           # Go to starting point
  #G91                                                   # Incremental positioning 
  #G1 X100 E22 F1000                                     # Primeline
  G90                                                   # Absolute positioning.
  G0 Z5 F3000                                           # Lift 5mm
  #G0 X{x_wait} Y{y_wait} Z8 F12000                      # Goto center of bed.
  G92 E0                       ; Reset extruder position
 
#####################################################################
#   A custom made print_end macro for via config.gab-3d.com/generate
#####################################################################
[gcode_macro PRINT_END]
gcode:
    #   Safe anti-stringing retractions
    G91                            ; relative positioning
    G1 E-2 F2700                   ; retract a little
    G1 E-2 Z0.2 F2400              ; retract and raise Z
    G1 Z10 F3000                   ; raise Z more to clear part
    
    #   Absolute positioning and safe parking
    G90                            ; absolute positioning
    G1 X297 Y297 F18000            ; park toolhead at rear right
    
    #   Turn off heaters, part cooling fan
    M104 S0                        ; turn off extruder
    M140 S0                        ; turn off bed
    M106 S0                        ; turn off part cooling fan

    #   =====================================================================
    #   🏆 THE WINNING CELEBRATION SEQUENCE
    #   =====================================================================
    status_print_done                                 # SINGLE MASTER CALL: Fires party_mode on ceiling + dim white done state on logo!
    G4 P20000                                         ; DWELL: Hold the celebration for 10 seconds before letting you turn them off
    SET_GCODE_VARIABLE MACRO=_LED_SEQUENCE VARIABLE=in_print VALUE=0
    _LED_UNLOCK
    status_ready
    #   Smart Exhaust Timer (Runs for 5 minutes then turns off)
    {% if printer["fan_generic exhaust_fan"].speed > 0.0 %}
        M117 Clearing fumes (5m)...
        UPDATE_DELAYED_GCODE ID=DISABLE_EXHAUST DURATION=300
    {% endif %}


#####################################################################
#End of Customs
